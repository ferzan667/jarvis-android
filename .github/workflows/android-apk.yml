name: JARVIS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compile APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Name and hash APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk JARVIS-Hey-Jarvis-debug.apk
          sha256sum JARVIS-Hey-Jarvis-debug.apk > JARVIS-Hey-Jarvis-debug.apk.sha256

      - name: Publish APK for download
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-APK
          path: |
            JARVIS-Hey-Jarvis-debug.apk
            JARVIS-Hey-Jarvis-debug.apk.sha256
          retention-days: 30
          if-no-files-found: error
