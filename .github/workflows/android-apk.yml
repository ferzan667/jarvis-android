name: JARVIS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK API 35 (runner SDK)
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found in $SDK_DIR/cmdline-tools"
            exit 1
          fi
          echo "SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_DIR" "platforms;android-35" "build-tools;35.0.0"

      - name: Install single-word Jarvis model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          curl -fL --retry 4 --connect-timeout 15 \
            "https://raw.githubusercontent.com/fwartner/home-assistant-wakewords-collection/main/en/jarvis/jarvis_v1.onnx" \
            -o app/src/main/assets/jarvis_v1.onnx
          test "$(stat -c%s app/src/main/assets/jarvis_v1.onnx)" -eq 208134
          echo "Model SHA256:"
          sha256sum app/src/main/assets/jarvis_v1.onnx

      - name: Compile APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Name and hash APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk JARVIS-debug.apk
          sha256sum JARVIS-debug.apk > JARVIS-debug.apk.sha256

      - name: Publish APK for download
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-APK
          path: |
            JARVIS-debug.apk
            JARVIS-debug.apk.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Publish versioned release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v0.3.3 JARVIS-debug.apk JARVIS-debug.apk.sha256 \
            --target "$GITHUB_SHA" --title "JARVIS 0.3.3" \
            --notes "Deneme sürümü. ChatGPT Voice kilit ekranından otomatik başlatılamaz. APK debug imzalıdır; farklı CI çalışmaları arasında güncelleme için önce eski sürümü kaldırmak gerekebilir."


